<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>EUNIE</title>
    <!-- Google Fonts: 非同步載入，不阻塞渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400;500&family=Shippori+Mincho:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet';this.removeAttribute('as')">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400;500&family=Shippori+Mincho:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Noto+Serif+TC:wght@400;500;600;700&display=swap"></noscript>
    <style>
      /* 防止 JS 載入前白屏閃爍，與 Tailwind bg-bg-washi 一致 */
      html, body { margin: 0; padding: 0; background-color: #faf8f5; }
      #root { min-height: 100vh; background-color: #faf8f5; }
      /* 初始 loading 指示器，CSS-only 不依賴 JS */
      #initial-loader {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background-color: #faf8f5; z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #initial-loader.hidden { opacity: 0; pointer-events: none; }
      #initial-loader span {
        width: 40px; height: 40px; border-radius: 50%;
        background: radial-gradient(circle, #c4a882 0%, transparent 70%);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 0.7; transform: scale(1.1); }
      }
    </style>
    <script>
      /**
       * Fix for "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
       * This happens in some iframe environments where fetch is a read-only getter on the prototype.
       */
      (function() {
        try {
          const originalFetch = window.fetch;
          if (typeof originalFetch !== 'function') return;
          
          // Try to define it on the window instance directly with a getter/setter pair
          // This is more robust than a simple value property in some environments
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(v) { currentFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If shadowing on window instance fails, try to add a setter to the prototype
          try {
            const proto = window.Window ? window.Window.prototype : Object.getPrototypeOf(window);
            const desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (desc && desc.get && !desc.set) {
              Object.defineProperty(proto, 'fetch', {
                get: desc.get,
                set: function(v) {
                  try {
                    Object.defineProperty(this, 'fetch', {
                      value: v, writable: true, configurable: true, enumerable: true
                    });
                  } catch (e3) {
                    // If even this fails, we might be in a very restricted environment
                    // but at least we have a setter now to prevent the TypeError
                  }
                },
                configurable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="initial-loader"><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // React 掛載後隱藏初始 loader
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('initial-loader');
            if (loader) loader.classList.add('hidden');
            setTimeout(function() {
              if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            }, 400);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
</html>
